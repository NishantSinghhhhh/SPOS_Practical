<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            text-align: center;
        }
        .box {
            background: white;
            width: 350px;
            margin: 80px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        input { margin: 8px; padding: 6px; width: 200px; }
        select { margin: 8px; padding: 6px; width: 214px; }
        button {
            padding: 8px 20px;
            background: #3366cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Simple Calculator</h2>
        <form action="CalcServlet" method="post">
            Number 1: <input type="number" name="num1" step="any"><br>
            Number 2: <input type="number" name="num2" step="any"><br>
            Operation:
            <select name="op">
                <option value="add">Addition (+)</option>
                <option value="sub">Subtraction (-)</option>
                <option value="mul">Multiplication (*)</option>
                <option value="div">Division (/)</option>
                <option value="mod">Modulus (%)</option>
            </select><br><br>
            <button type="submit">Calculate</button>
        </form>
    </div>
</body>
</html>
