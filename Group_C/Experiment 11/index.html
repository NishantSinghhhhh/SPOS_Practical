<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
        }
        .box {
            background: white;
            width: 350px;
            margin: 80px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        input { margin: 8px; padding: 6px; width: 200px; }
        button { padding: 8px 20px; background: #3366cc; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Login Page</h2>
        <form action="LoginServlet" method="post">
            Username: <input type="text" name="uname"><br>
            Password: <input type="password" name="pass"><br>
            Remember Me: <input type="checkbox" name="remember"><br><br>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
